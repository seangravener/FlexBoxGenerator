<div *ngIf="flexContainer$ | async as flexContainer" class="flex flex-wrap items-center gap-8">
  <flex-item-actions></flex-item-actions>
  <label class="flex items-center gap-2">
    <code><pre>Display: flex</pre></code>
    <input type="checkbox" [checked]="flexContainer.style?.display === 'flex'" class="checkbox checkbox-sm"
      name="display" (click)="onChange($event)" />
  </label>

  <label class="flex items-center gap-4">
    <code><pre>Flex Direction</pre></code>
    <select class="select select-bordered flex-grow" (change)="onChange($event)" name="flexDirection">
      <option *ngFor="let option of flexContainerStyleOptions.display" [value]="option"
        [selected]="option === currentDisplayMode">
        {{ option }}
      </option>
    </select>
  </label>

  <label class="flex items-center gap-4">
    <code><pre>Flex Wrap</pre></code>
    <select class="select select-bordered flex-grow" (change)="onChange($event)" name="flexWrap">
      <option *ngFor="let option of flexContainerStyleOptions.flexWrap" [value]="option">
        {{ option }}
      </option>
    </select>
  </label>

  <!-- keyvalue pipe is flattening style array; -->
  <label *ngFor="let style of flexContainerStyleOptions | keyvalue" class="flex items-center gap-4">
    {{ style.key }}
    <select class="select select-bordered flex-grow" (change)="onChange($event)" [name]="style.key">
      <option *ngFor="let option of style.value" [value]="option">
        {{ option }}
      </option>
    </select>
  </label>
</div>
