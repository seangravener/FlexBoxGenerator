<div #canvas *ngIf="flexItems$ | async as flexItems" class="canvas bordered">
  <div class="container" [style.display]="canvasDisplayMode">
    <div *ngFor="let item of flexItems" class="box bordered" [style.background]="item.style.backgroundColor">
      <div class="content">
        <div class="content--title">{{ item.content }}</div>
      </div>
    </div>
  </div>
</div>

<ng-template #showLoading>
  Loading ...
</ng-template>
