<div #canvas *ngIf="flexItems$ | async as flexItems">
  <div class="container" [style.display]="canvasDisplayMode">
    <div *ngFor="let item of flexItems" class="border border-slate-800 rounded-md text-black m-1 p-2" [style]="item.style">
      <div class="content">
        <div class="content--title">{{ item.content }}</div>
      </div>
    </div>
  </div>
</div>

<ng-template #showLoading>
  Loading ...
</ng-template>
