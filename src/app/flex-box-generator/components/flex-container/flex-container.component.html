<ng-container *ngIf="flexItems$ | async as flexItems">
  <div *ngIf="flexContainer$ | async as flexContainer" class="container overflow-hidden" [style]="flexContainer.style">
    <div *ngFor="let item of flexItems"
      class="flex justify-center items-center border border-slate-800 rounded-md text-black m-2 p-2 h-24 w-24"
      [style]="item.style">
      <div class="content">
        <div class="content--title">{{ item.content }}</div>
      </div>
    </div>
  </div>
</ng-container>

<ng-template #showLoading>
  Loading ...
</ng-template>
