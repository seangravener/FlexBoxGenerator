<div class="p-4" *ngIf="flexItems$ | async as flexItems else showLoading">

  <flex-item-actions></flex-item-actions>

  <ul class="flex flex-col gap-4 mb-4" *ngFor="let item of flexItems">
    <li class="item-option">
      {{ item.content }}

      <ul>
        <li *ngFor="let styleProp of item.styleProperties">
          {{ styleProp }}
        </li>
      </ul>

    </li>
  </ul>
</div>

<ng-template #showLoading>
  Loading ...
</ng-template>
