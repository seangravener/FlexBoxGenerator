<div *ngIf="flexItems$ | async as flexItems; else showLoading">
  <ul class="flex flex-col gap-4 my-4" *ngFor="let item of flexItems">
    <li class="border border-slate-500 rounded-md p-4 bg-slate-900 item-option">
      content: {{ item.content }}

      <ul>
        <li *ngFor="let style of item.style | keyvalue">{{ style.key }} : {{ style.value }}</li>
      </ul>
    </li>
  </ul>
</div>

<ng-template #showLoading> Loading ... </ng-template>
