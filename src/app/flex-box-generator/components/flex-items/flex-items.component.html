<div *ngIf="flexItems$ | async as flexItems; else showLoading">
  <form class="flex flex-col gap-1">
    <div *ngFor="let item of flexItems" class="flex items-center gap-1">
      <code><pre>{{ item | json }}: </pre></code>

      <div class="select select-bordered flex-grow" >
        <div *ngFor="let option of item.style | keyvalue" >
          {{ option | json }}
        </div>
      </div>
    </div>
  </form>

</div>

<ng-template #showLoading> Loading ... </ng-template>
