<div class="container mx-auto px-4" *ngIf="flexItems$ | async as flexItems else showLoading">
  <h3>Flex Item Options</h3>

  <items-actions></items-actions>

  <ng-container *ngFor="let item of flexItems">
    <div class="item-option">
      {{ item.content }}
    </div>
  </ng-container>
</div>

<ng-template #showLoading>
  Loading ...
</ng-template>
