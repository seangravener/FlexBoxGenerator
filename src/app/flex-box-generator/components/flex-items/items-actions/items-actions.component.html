<div class="flex item-option--actions" role="group">
  <button class="btn btn-primary rounded-r-none" (click)="onAddItem()">
    <i class="gg-add-r"></i> Add
  </button>
  <button class="btn btn-primary rounded-none" (click)="onDeleteItem()">
    <i class="gg-math-minus"></i> Remove
  </button>
  <button class="btn rounded-l-none" (click)="onResetItems()">
    <i class="gg-trash"></i> Reset
  </button>
</div>
