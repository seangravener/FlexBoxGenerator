<ng-container *ngIf="flexItems$ | async as flexItems">
  <aside class="flex flex-col gap-4 mb-4">
    <flex-container *ngIf="flexItems"></flex-container>
  </aside>
  <main class="flex gap-6">
    <flex-canvas class="w-2/3 border border-slate-600 rounded-md"></flex-canvas>
    <aside class="w-1/3 border border-slate-600 rounded-md">
      <flex-items *ngIf="flexItems"></flex-items>
    </aside>
  </main>
</ng-container>
