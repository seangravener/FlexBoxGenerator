<ng-container *ngIf="flexItems$ | async as flexItems">
  <aside class="flex flex-col gap-4 mb-4">
    <flex-container-toolset *ngIf="flexItems"></flex-container-toolset>
  </aside>
  <main class="flex gap-6">
    <flex-container class="w-2/3 dark:bg-slate-900 border border-slate-700 rounded-md"></flex-container>
    <aside class="w-1/3">
      <flex-items *ngIf="flexItems"></flex-items>
    </aside>
  </main>
</ng-container>
