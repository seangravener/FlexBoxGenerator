<div *ngIf="flexItems$ | async as flexItems" class="container-fluid">
  <div class="row">
    <aside class="col-3">
      <flex-container *ngIf="flexItems"></flex-container>
    </aside>
    <main class="col-6">
      <flex-canvas></flex-canvas>
    </main>
    <aside class="col-3">
      <flex-items *ngIf="flexItems"></flex-items>
    </aside>
  </div>
</div>
